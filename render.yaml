services:
  - type: web
    name: constructpro-backend
    env: python
    rootDir: backend
    buildCommand: "./build.sh"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.0
      - key: APP_ENV
        value: production
      - key: FRONTEND_URL
        fromService:
          type: web
          name: constructpro-frontend
          envVarKey: RENDER_EXTERNAL_URL
    disk:
      name: sqlite-data
      mountPath: /data
      sizeGB: 1

  - type: web
    name: constructpro-frontend
    env: static
    rootDir: frontend
    buildCommand: "npm install && npm run build"
    staticPublishPath: "./dist"
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: constructpro-backend
          envVarKey: RENDER_EXTERNAL_URL
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
