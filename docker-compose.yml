version: "3.9"

services:
  postgres:
    image: postgres:15-alpine
    container_name: constructpro_db
    environment:
      POSTGRES_USER: constructpro
      POSTGRES_PASSWORD: constructpro_pass
      POSTGRES_DB: constructpro_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U constructpro -d constructpro_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: constructpro_backend
    environment:
      - DATABASE_URL=postgresql://constructpro:constructpro_pass@postgres:5432/constructpro_db
      - SECRET_KEY=${SECRET_KEY:-dev-secret-key-change-in-prod}
      - ALGORITHM=HS256
      - ACCESS_TOKEN_EXPIRE_MINUTES=30
      - REFRESH_TOKEN_EXPIRE_DAYS=7
      - APP_ENV=development
      - DEBUG=true
      - CORS_ORIGINS=http://localhost:5173,http://localhost:3000
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  adminer:
    image: adminer
    container_name: constructpro_adminer
    ports:
      - "8080:8080"
    depends_on:
      - postgres

volumes:
  postgres_data:
